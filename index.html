<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Khung Ngắm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23121212%22/%3E%3Cpath d=%22M11 4v24M21 4v24M4 11h24M4 21h24%22 stroke=%22%23e9b44c%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
  /* Giao diện xám trung tính có chủ đích: nền có màu làm lệch cảm nhận màu ảnh */
  :root {
    --bg: #121212; --panel: #1b1b1b; --line: #2c2c2c; --text: #ececec; --muted: #9a9a9a;
    --accent: #e9b44c; --ok: #6fd08c; --warn: #ff8a5c;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  /* manipulation trên MỌI phần tử: chạm đúp vào nút không phóng to trang (user từng kẹt). touch-action không kế thừa,
     và bị ngắt ở hàng cuộn ngang, nên đặt ở body là không đủ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.4 "Be Vietnam Pro", system-ui, -apple-system, sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .screen { position: fixed; inset: 0; display: none; height: 100dvh; }
  .screen.on { display: grid; grid-template-columns: minmax(0, 1fr); }

  /* ---------- Màn chụp ---------- */
  #cam { grid-template-rows: auto 1fr auto; }
  .topbar { padding: calc(var(--safe-t) + 10px) 12px 8px; background: var(--bg); z-index: 2; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 12px; border-radius: 999px; background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); white-space: nowrap; font-size: 13px; }
  .chip.on { color: #111; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .chip .sug { margin-left: 4px; color: var(--accent); }
  .chip.on .sug { color: #111; }
  .chip.help { width: 34px; padding-left: 0; padding-right: 0; text-align: center; font-weight: 600; }
  /* bảng so sánh khung bố cục */
  .sheet { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet[hidden] { display: none; }
  .sheet .card { width: min(520px, 100%); max-height: 85%; overflow-y: auto; background: var(--panel); border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(var(--safe-b) + 14px); }
  .sheet .h { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .sheet .h button { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.1); }
  .gsug { color: var(--accent); font-size: 13px; margin: 6px 0 8px; }
  .grow { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px; border-radius: 12px; border: 1px solid transparent; }
  .grow.on { border-color: var(--accent); }
  .grow canvas { width: 60px; height: 76px; flex: none; border-radius: 6px; }
  .grow b { display: block; font-weight: 600; } .grow b .sug { color: var(--accent); font-size: 12px; }
  .grow small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
  .chip .cyc { opacity: .7; margin-left: 4px; }
  .chip.scene.on { background: #f2f2f2; border-color: #f2f2f2; color: #111; }
  .scenes { margin-bottom: 8px; }
  .scenes .chips { flex: 1; min-width: 0; }
  .lbl { flex: none; font-size: 12px; color: var(--muted); }
  .round.sm { width: 36px; height: 36px; flex: none; }
  .round.sm svg { width: 18px; height: 18px; }

  .stage { position: relative; overflow: hidden; background: #000; touch-action: manipulation; }
  /* toàn màn hình: ảnh phủ kín, hai thanh điều khiển nổi đè lên */
  #cam.full { grid-template-rows: minmax(0, 1fr); }
  #cam.full > * { grid-area: 1 / 1; }
  #cam.full .topbar { align-self: start; background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); padding-bottom: 16px; }
  #cam.full .controls { align-self: end; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.65)); padding-top: 22px; }
  #cam.full .chip:not(.on), #cam.full .round { background: rgba(0,0,0,.42); border-color: rgba(255,255,255,.16); color: #eee; }
  #cam.full .small, #cam.full .lbl { color: #ddd; text-shadow: 0 1px 3px #000; }
  #cam.full #fullBtn { color: var(--accent); }
  .assist { position: absolute; left: 12px; right: 12px; top: calc(var(--insT, 0px) + 10px); padding: 10px 12px; border-radius: 12px;
    background: rgba(0,0,0,.66); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13.5px;
    max-height: calc(100% - var(--insT, 0px) - var(--insB, 0px) - 20px); overflow-y: auto; }
  .assist .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: #bbb; }
  .assist .h b { color: var(--accent); font-size: 13px; }
  .assist .h button { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .assist .msg { font-weight: 500; }
  .assist.ok .msg { color: var(--ok); }
  .assist .opts { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .assist .opts:not(:empty) { margin-top: 8px; }
  .assist .opts .chip { padding: 4px 9px; font-size: 12px; }
  .assist .tipx { color: #b5b5b5; font-size: 12px; margin-top: 6px; white-space: pre-line; }
  .assist .tipx:empty { display: none; }
  /* bước đặt vật: bảng xuống đáy khung; đang kéo thì mờ đi để thấy cả khung */
  .assist.dock { top: auto; bottom: calc(var(--insB, 0px) + 10px); z-index: 1; } /* nổi trên đồng hồ đo sáng */
  .assist.ghost { opacity: .12; pointer-events: none; }
  .assist .tok { touch-action: none; border-style: dashed; }
  .assist .tok.on { border-style: solid; }
  .assist .go { display: block; width: 100%; margin-top: 8px; padding: 9px; border-radius: 10px; background: var(--accent); color: #111; font-weight: 600; }
  .assist .go:disabled { opacity: .4; }
  .assist .go[hidden] { display: none; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video.mirror { transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .tip { position: absolute; left: 12px; right: 12px; top: calc(var(--insT, 0px) + 10px); padding: 8px 12px; border-radius: 10px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: 12.5px; color: #ddd; transition: opacity .3s; }
  .tip.hide { opacity: 0; pointer-events: none; }
  .meter { position: absolute; right: 12px; bottom: calc(var(--insB, 0px) + 12px); display: flex; align-items: flex-end; gap: 8px;
    pointer-events: none; }
  .meter canvas { width: 96px; height: 34px; background: rgba(0,0,0,.45); border-radius: 6px; }
  .meter span { font-size: 11.5px; background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 6px; }
  .meter span.bad { color: var(--warn); }
  #level { position: absolute; left: 50%; top: 50%; width: 46%; height: 0; pointer-events: none; display: none; }
  #level .ref, #level .bar { position: absolute; left: 0; right: 0; top: 0; height: 0; }
  #level .ref::before, #level .ref::after { content: ""; position: absolute; top: -1px; width: 18%; height: 2px; background: rgba(255,255,255,.6); }
  #level .ref::before { left: -24%; } #level .ref::after { right: -24%; }
  #level .bar { border-top: 2px solid rgba(255,255,255,.9); transform-origin: 50% 0; }
  #level.flat .bar, #level.flat .ref::before, #level.flat .ref::after { border-color: var(--ok); background: var(--ok); }
  #level .deg { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); font-size: 12px;
    background: rgba(0,0,0,.5); padding: 1px 7px; border-radius: 6px; }
  #level.flat .deg { color: var(--ok); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #countdown { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; font-weight: 600;
    color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,.6); pointer-events: none; }
  .nocam { position: absolute; inset: 0; display: none; place-content: center; text-align: center; padding: 24px; gap: 14px; }
  .nocam.on { display: grid; }
  .nocam p { margin: 0; color: var(--muted); max-width: 420px; }

  .controls { background: var(--bg); padding: 10px 12px calc(var(--safe-b) + 14px); z-index: 2; }
  .row { display: flex; align-items: center; gap: 8px; }
  .ratios { margin-bottom: 12px; }
  /* căn giữa nhưng vẫn cuộn được khi tràn (justify-content:center cắt mất chip đầu) */
  .ratios > :first-child { margin-left: auto; } .ratios > :last-child { margin-right: auto; }
  .pro { justify-content: center; gap: 14px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .pro label { display: flex; align-items: center; gap: 6px; }
  .pro input { width: 110px; }
  .shoot { justify-content: space-between; max-width: 420px; margin: 0 auto; }
  .round { width: 48px; height: 48px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line);
    display: grid; place-items: center; }
  .round svg { width: 22px; height: 22px; }
  .small { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }
  .tool { display: flex; flex-direction: column; align-items: center; }
  #shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 5px; }
  #shutter::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform .1s; }
  #shutter:active::after { transform: scale(.88); }
  #shutter:disabled { opacity: .35; }

  /* ---------- Màn chỉnh màu ---------- */
  #edit { grid-template-rows: auto minmax(0, 1fr) auto auto; }
  .ehead { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-t) + 8px) 10px 8px; }
  .ehead h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .txtbtn { padding: 8px 10px; border-radius: 8px; color: var(--muted); }
  .txtbtn:hover { color: var(--text); }
  .view { position: relative; display: grid; place-items: center; padding: 0 10px; min-height: 0; }
  /* giãn vừa khung cả khi ảnh nhỏ hơn chỗ trống (camera độ phân giải thấp) */
  #pv { width: 100%; height: 100%; object-fit: contain; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  .badge { position: absolute; left: 20px; top: 10px; font-size: 11.5px; background: rgba(0,0,0,.6); padding: 3px 8px;
    border-radius: 6px; pointer-events: none; display: none; }
  .badge.on { display: block; }
  #ehist { position: absolute; right: 20px; top: 10px; width: 96px; height: 34px; background: rgba(0,0,0,.45);
    border-radius: 6px; pointer-events: none; }

  .panel { background: var(--bg); padding: 10px 0 4px; max-height: 42dvh; overflow-y: auto; }
  .sect { padding: 0 14px; margin-bottom: 12px; }
  .sect h2 { font-size: 11.5px; font-weight: 500; color: var(--muted); margin: 0 0 7px; letter-spacing: .04em; text-transform: uppercase;
    display: flex; justify-content: space-between; gap: 8px; }
  .sect h2 b { font-weight: 500; color: var(--text); text-transform: none; letter-spacing: 0; }
  .pal { display: flex; height: 40px; border-radius: 8px; overflow: hidden; }
  .pal button { position: relative; min-width: 0; }
  .pal button span { position: absolute; left: 5px; bottom: 3px; font-size: 10px; opacity: 0; transition: opacity .15s; }
  .pal:hover button span, .pal.show button span { opacity: 1; }
  .harm { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .harm b { color: var(--text); font-weight: 500; }
  .presets { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 4px; scrollbar-width: none; }
  .presets::-webkit-scrollbar { display: none; }
  .pr { flex: none; width: 74px; text-align: center; font-size: 11.5px; color: var(--muted); position: relative; }
  .pr canvas { width: 74px; height: 74px; border-radius: 8px; display: block; margin-bottom: 4px; outline: 2px solid transparent; outline-offset: 1px; }
  .pr.on { color: var(--text); font-weight: 600; }
  .pr.on canvas { outline-color: var(--accent); }
  .pr .star { position: absolute; top: 4px; right: 4px; background: var(--accent); color: #111; font-size: 9.5px; font-weight: 600;
    padding: 1px 5px; border-radius: 5px; }
  .note { padding: 6px 14px 0; font-size: 12.5px; color: var(--muted); min-height: 22px; }
  .note b { color: var(--accent); font-weight: 500; }
  .sl { display: grid; grid-template-columns: 112px 1fr 38px; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0; }
  .sl output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; list-style: none; }
  details summary::before { content: "▸ "; } details[open] summary::before { content: "▾ "; }
  /* nút lưu luôn nằm ngoài vùng cuộn — trước đây nằm dưới đáy panel nên người dùng không thấy */
  .savebar { display: flex; gap: 8px; padding: 8px 14px calc(var(--safe-b) + 10px); align-items: center; flex-wrap: wrap;
    border-top: 1px solid var(--line); background: var(--bg); }
  .primary { flex: 1; min-width: 140px; padding: 12px; border-radius: 10px; background: var(--accent); color: #111; font-weight: 600; }
  .secondary { flex: 1; min-width: 140px; padding: 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .primary:disabled, .secondary:disabled { opacity: .5; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); width: 100%; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 24px); transform: translateX(-50%); background: #2a2a2a;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  .toast.on { opacity: 1; }

  @media (min-width: 900px), (orientation: landscape) and (max-height: 560px) {
    #edit { grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "h h" "v p" "v s"; }
    .ehead { grid-area: h; } .view { grid-area: v; } .panel { grid-area: p; } .savebar { grid-area: s; }
    .panel { max-height: none; border-left: 1px solid var(--line); padding-top: 14px; }
    .savebar { border-left: 1px solid var(--line); }
    .view { padding: 0 20px 20px; }
  }
  /* Điện thoại cầm ngang: chỉ còn ~390px chiều cao, xếp chồng như màn dọc thì khung ngắm còn chưa tới 100px.
     Nút chụp thành cột bên phải (như app camera), hai hàng chip nổi đè lên ảnh. JS đọc cùng điều kiện ở landMQ. */
  @media (orientation: landscape) and (max-height: 560px) {
    #cam.screen { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); }
    #cam.screen > .stage { grid-area: 1 / 1; }
    #cam.screen > .topbar { grid-area: 1 / 1; align-self: start; display: flex; gap: 10px; align-items: center;
      padding: calc(var(--safe-t) + 6px) 10px 14px calc(env(safe-area-inset-left, 0px) + 10px);
      background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); }
    #cam.screen .topbar .scenes { margin: 0; flex: 1 1 55%; min-width: 0; }
    #cam.screen .topbar #guides { flex: 1 1 45%; min-width: 0; }
    #cam.screen > .controls { display: contents; }
    #cam.screen #ratios { grid-area: 1 / 1; align-self: end; margin: 0; z-index: 2;
      padding: 0 10px 12px calc(env(safe-area-inset-left, 0px) + 10px); }
    #cam.screen #pro { grid-area: 1 / 1; align-self: end; margin-bottom: 58px; z-index: 2; }
    #cam.screen .shoot { grid-area: 1 / 2; flex-direction: column; justify-content: center; gap: 12px; max-width: none; margin: 0;
      padding: 8px calc(env(safe-area-inset-right, 0px) + 12px) 8px 12px; background: var(--bg); z-index: 2; }
    #cam.screen .shoot .small { display: none; }
    #cam.screen .round { width: 44px; height: 44px; }
    #cam.screen #shutter { width: 66px; height: 66px; }
    #cam.screen .chip:not(.on) { background: rgba(0,0,0,.45); border-color: rgba(255,255,255,.16); color: #eee; }
    #cam.screen .lbl { color: #ddd; text-shadow: 0 1px 3px #000; }
    /* khung hướng dẫn/mẹo thành cột hẹp bên trái, không trải ngang che khung ngắm */
    #cam.screen .assist, #cam.screen .tip { right: auto; width: min(360px, 38%); left: calc(env(safe-area-inset-left, 0px) + 10px); }
    /* cầm ngang bảng đã là cột trái, không cần né chủ thể — xuống đáy thì tràn lên mất tiêu đề */
    #cam.screen .assist.dock { top: calc(var(--insT, 0px) + 10px); bottom: auto; }
    #edit { grid-template-columns: minmax(0, 1fr) 340px; }
    .ehead { padding-top: calc(var(--safe-t) + 4px); padding-bottom: 4px; }
    .view { padding: 0 10px 10px calc(env(safe-area-inset-left, 0px) + 10px); }
  }
</style>
</head>
<body>

<section id="cam" class="screen on" aria-label="Chụp ảnh">
  <div class="topbar">
    <div class="row scenes"><span class="lbl">Trong khung có:</span><div class="chips" id="scenes"></div>
      <button class="round sm" id="fullBtn" aria-label="Toàn màn hình" title="Toàn màn hình">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
    <div class="chips" id="guides"></div>
  </div>
  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="level"><div class="ref"></div><div class="bar"></div><span class="deg"></span></div>
    <div class="tip" id="tip"></div>
    <div class="assist" id="assist" hidden>
      <div class="h"><span><b id="asTitle"></b> <span id="asStep"></span></span><button id="asClose" aria-label="Thoát hướng dẫn">✕</button></div>
      <div class="msg" id="asMsg"></div>
      <div class="opts" id="asOpts"></div>
      <div class="opts" id="asDir"></div>
      <div class="opts" id="asTok"></div>
      <button class="go" id="asGo"></button>
      <div class="tipx" id="asTip"></div>
    </div>
    <div class="meter"><span id="meterTxt"></span><canvas id="hist" width="192" height="68"></canvas></div>
    <div id="flash"></div>
    <div id="countdown"></div>
    <div class="nocam" id="nocam">
      <p id="nocamMsg">Đang mở camera…</p>
      <div><button class="secondary" id="nocamPick" style="flex:none;padding:10px 18px">Chọn ảnh có sẵn</button></div>
    </div>
  </div>
  <div class="sheet" id="gsheet" hidden><div class="card">
    <div class="h"><b>Nên chọn khung nào?</b><button id="gsClose" aria-label="Đóng">✕</button></div>
    <div class="gsug" id="gsSug"></div><div id="gsList"></div>
  </div></div>
  <div class="controls">
    <div class="chips row ratios" id="ratios"></div>
    <div class="row pro" id="pro" hidden></div>
    <div class="row shoot">
      <div class="tool"><button class="round" id="pick" aria-label="Chọn ảnh có sẵn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
        <div class="small">Thư viện</div></div>
      <div class="tool"><button class="round" id="timer" aria-label="Hẹn giờ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></button>
        <div class="small" id="timerTxt">Tắt</div></div>
      <button id="shutter" aria-label="Chụp" disabled></button>
      <div class="tool"><button class="round" id="levelBtn" aria-label="Thước cân bằng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h18"/><circle cx="12" cy="12" r="3"/></svg></button>
        <div class="small" id="levelTxt">Cân bằng</div></div>
      <div class="tool"><button class="round" id="flip" aria-label="Đổi camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h12l-3-3M20 16H8l3 3"/></svg></button>
        <div class="small">Đổi cam</div></div>
    </div>
  </div>
</section>

<section id="edit" class="screen" aria-label="Chỉnh màu">
  <div class="ehead">
    <button class="txtbtn" id="back">← Chụp lại</button>
    <h1>Chọn gam màu</h1>
    <button class="txtbtn" id="reset">Đặt lại</button>
  </div>
  <div class="view">
    <canvas id="pv"></canvas>
    <div class="badge" id="cmpBadge">Ảnh gốc</div>
    <canvas id="ehist" width="192" height="68"></canvas>
  </div>
  <div class="panel">
    <div class="sect">
      <h2><span>Bảng màu của ảnh</span><b id="tempTxt"></b></h2>
      <div class="pal" id="pal"></div>
      <div class="harm" id="harm"></div>
    </div>
    <div class="sect" style="padding:0;margin-bottom:4px">
      <h2 style="padding:0 14px"><span>Gam màu</span><span style="text-transform:none;letter-spacing:0">giữ ảnh để so với gốc</span></h2>
      <div class="presets" id="presets"></div>
      <div class="note" id="note"></div>
    </div>
    <div class="sect">
      <div class="sl"><span>Độ đậm</span><input type="range" id="amount" min="0" max="100" value="100"><output id="amountOut">100</output></div>
      <details id="adv">
        <summary>Chỉnh tay</summary>
        <div id="adjs"></div>
      </details>
    </div>
  </div>
  <div class="savebar">
    <label class="check"><input type="checkbox" id="withPal"> Kèm dải bảng màu dưới ảnh</label>
    <button class="primary" id="share" hidden>Lưu vào Ảnh</button>
    <button class="primary" id="dl">Tải ảnh về</button>
  </div>
</section>

<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script src="grade.js"></script>
<script src="app.js"></script>
</body>
</html>
